[package]
name = "rpa-native-input"
version = "0.1.0"
edition = "2021"
description = "Extractable native desktop input: event construction and local held-state over raw platform APIs (Windows/macOS/X11), no host/serde/network dependencies"
license = "MIT"

[workspace]

[dependencies]
# Raw platform bindings only. No host, MCP, screenshot, serde, image, agent or
# network dependencies by contract.

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

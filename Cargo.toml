[package]
name = "rpa-computer"
version = "0.1.0"
edition = "2021"
description = "Cross-platform computer-use runtime: screenshot + input injection behind a cancellation-aware session runtime and MCP host"
license = "MIT"

[dependencies]
rpa-display-topology = { path = "crates/display-topology" }
rpa-windows-display = { path = "crates/windows-display" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
image = { version = "0.24.8", default-features = false, features = ["png"] }
screenshots = "0.8"
rpa-native-input = { path = "crates/native-input" }
rpa-desktop-feedback = { path = "crates/desktop-feedback" }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Official bindings for the Windows backend DPI declarations (replaces the
# previous hand-written user32 externs). Keep in sync with the
# rpa-native-input crate's windows features.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
] }

[profile.release]
strip = true
lto = true

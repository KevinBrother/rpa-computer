[package]
name = "rpa-computer"
version = "0.1.0"
edition = "2021"
description = "Cross-platform computer-use runtime: screenshot + input injection behind a cancellation-aware session runtime and MCP host"
license = "MIT"

[dependencies]
rpa-display-topology = { path = "crates/display-topology" }
rpa-windows-display = { path = "crates/windows-display" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
image = { version = "0.24.8", default-features = false, features = ["png"] }
screenshots = "0.8"
rpa-native-input = { path = "crates/native-input" }
rpa-desktop-feedback = { path = "crates/desktop-feedback" }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Shared core protocol for display/lease/hotkeys; display uses RandR, hotkeys use XKB.
xcb = { version = "=1.7.1", features = ["randr", "xkb"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Official bindings for host-owned DPI and explicit clipboard paste.
# Native-input remains independent of the clipboard path.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
